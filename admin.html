<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="noindex,nofollow">

    <title>WENDK SHOP | Administration</title>

    <link rel="stylesheet" href="admin.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >
</head>

<body>

<!-- ================= LOGIN ================= -->

<section id="loginScreen" class="login-screen">

    <div class="login-card">

        <div class="admin-logo">
            W
        </div>

        <span class="login-label">
            WENDK SHOP
        </span>

        <h1>
            Administration
        </h1>

        <p>
            Connectez-vous pour gérer les commandes.
        </p>

        <form id="loginForm">

            <label>
                Email
                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Votre email"
                    required
                    autocomplete="email"
                >
            </label>

            <label>
                Mot de passe
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Votre mot de passe"
                    required
                    autocomplete="current-password"
                >
            </label>

            <button
                type="submit"
                class="btn btn-primary"
                id="loginBtn"
            >
                🔐 Se connecter
            </button>

            <p
                id="loginError"
                class="error-message"
            ></p>

        </form>

    </div>

</section>


<!-- ================= DASHBOARD ================= -->

<section
    id="dashboard"
    class="dashboard hidden"
>

    <header class="admin-header">

        <div>

            <span class="admin-label">
                WENDK SHOP
            </span>

            <h1>
                Tableau de bord
            </h1>

        </div>

        <button
            id="logoutBtn"
            class="btn btn-secondary"
        >
            🚪 Déconnexion
        </button>

    </header>


    <!-- ================= STATISTIQUES ================= -->

    <div class="stats-grid">

        <div class="stat-card">

            <span>
                📦 Commandes
            </span>

            <strong id="totalOrders">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                🆕 Nouvelles
            </span>

            <strong id="newOrders">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                💰 Chiffre d'affaires
            </span>

            <strong id="totalRevenue">
                0 FCFA
            </strong>

        </div>

    </div>


    <!-- ================= COMMANDES ================= -->

    <div class="orders-card">

        <div class="orders-header">

            <div>

                <span class="admin-label">
                    GESTION
                </span>

                <h2>
                    Commandes
                </h2>

            </div>

            <button
                id="refreshBtn"
                class="btn btn-secondary"
            >
                🔄 Actualiser
            </button>

        </div>


        <div
            id="loading"
            class="loading"
        >
            Chargement des commandes...
        </div>


        <div
            id="ordersContainer"
            class="orders-container"
        ></div>


        <div
            id="emptyOrders"
            class="empty-orders hidden"
        >
            <div>📦</div>

            <h3>
                Aucune commande
            </h3>

            <p>
                Les nouvelles commandes apparaîtront ici.
            </p>
        </div>

    </div>

</section>


<script src="admin.js"></script>

</body>
  </html>
